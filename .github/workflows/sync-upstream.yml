name: Sync with upstream releases

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: upstream-release-sync
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      release_found: ${{ steps.check.outputs.release_found }}
      needs_sync: ${{ steps.check.outputs.needs_sync }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      release_prerelease: ${{ steps.check.outputs.release_prerelease }}
      release_sha: ${{ steps.check.outputs.release_sha }}
      base_sha: ${{ steps.check.outputs.base_sha }}
      conflict: ${{ steps.check.outputs.conflict }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the latest upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh api "repos/JamsusMaximus/trainingpeaks-mcp/releases?per_page=100" \
            --jq 'map(select(.draft == false)) | sort_by(.published_at) | last // empty | [.tag_name, (.prerelease | tostring)] | @tsv')

          if [[ -z "$release" ]]; then
            echo "No published upstream releases found."
            echo "release_found=false" >> "$GITHUB_OUTPUT"
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=$'\t' read -r release_tag release_prerelease <<< "$release"
          if ! git check-ref-format "refs/tags/$release_tag"; then
            echo "::error::Upstream release has an invalid tag name."
            exit 1
          fi

          git remote add upstream https://github.com/JamsusMaximus/trainingpeaks-mcp.git
          git fetch --no-tags upstream "refs/tags/$release_tag:refs/upstream-tags/$release_tag"
          git fetch origin "refs/heads/main:refs/remotes/origin/main"

          release_sha=$(git rev-parse "refs/upstream-tags/$release_tag^{commit}")
          base_sha=$(git rev-parse refs/remotes/origin/main)
          tag_is_synced=false
          if git ls-remote --exit-code origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$release_tag:refs/origin-tags/$release_tag"
            existing_tag_sha=$(git rev-parse "refs/origin-tags/$release_tag^{commit}")
            if [[ "$existing_tag_sha" != "$release_sha" ]]; then
              echo "::error::Fork tag $release_tag exists but points to a different commit."
              exit 1
            fi
            tag_is_synced=true
          fi

          if git merge-base --is-ancestor "$release_sha" "$base_sha"; then
            release_is_merged=true
          else
            release_is_merged=false
          fi

          handled=false
          if git ls-remote --exit-code --tags origin "refs/tags/upstream-handled/$release_tag" >/dev/null 2>&1; then
            handled=true
          fi

          conflict=false
          if [[ "$release_is_merged" == true && "$tag_is_synced" == true ]]; then
            needs_sync=false
            echo "Upstream release $release_tag and its tag are already synced."
          elif [[ "$handled" == true && "$release_is_merged" == false ]]; then
            needs_sync=false
            echo "Upstream release $release_tag was already tested and reported."
          else
            needs_sync=true
            echo "Found upstream release $release_tag (prerelease=$release_prerelease)."
            git checkout --detach "$base_sha"
            if ! git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              merge --no-ff --no-edit "$release_sha" >/dev/null 2>&1; then
              conflict=true
              echo "Merging $release_tag into main produces conflicts."
            fi
          fi

          {
            echo "release_found=true"
            echo "needs_sync=$needs_sync"
            echo "release_tag=$release_tag"
            echo "release_prerelease=$release_prerelease"
            echo "release_sha=$release_sha"
            echo "base_sha=$base_sha"
            echo "conflict=$conflict"
          } >> "$GITHUB_OUTPUT"

  test-release:
    needs: check-release
    if: needs.check-release.outputs.needs_sync == 'true' && needs.check-release.outputs.conflict != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare the release merge candidate
        env:
          BASE_SHA: ${{ needs.check-release.outputs.base_sha }}
          RELEASE_SHA: ${{ needs.check-release.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.check-release.outputs.release_tag }}
        run: |
          git fetch origin "refs/heads/main:refs/remotes/origin/main"
          git remote add upstream https://github.com/JamsusMaximus/trainingpeaks-mcp.git
          git fetch --no-tags upstream "refs/tags/$RELEASE_TAG:refs/upstream-tags/$RELEASE_TAG"

          current_main=$(git rev-parse refs/remotes/origin/main)
          if [[ "$current_main" != "$BASE_SHA" ]]; then
            echo "::error::main changed after release detection; retry on the next schedule."
            exit 1
          fi

          fetched_release=$(git rev-parse "refs/upstream-tags/$RELEASE_TAG^{commit}")
          if [[ "$fetched_release" != "$RELEASE_SHA" ]]; then
            echo "::error::The upstream release tag changed after detection."
            exit 1
          fi

          git checkout --detach "$BASE_SHA"
          git -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            merge --no-ff --no-edit "$RELEASE_SHA"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Assert mcp SDK major version (2.x)
        run: |
          python -c "from importlib.metadata import version; v = version('mcp'); assert int(v.split('.')[0]) == 2, f'mcp resolved to {v}, expected 2.x - the <2 cap in pyproject.toml is not being enforced'"

      - name: Lint
        run: ruff check src/

      - name: Type check
        run: mypy src/

      - name: Run tests
        run: pytest tests/ -v

  sync-release:
    needs: [check-release, test-release]
    if: needs.check-release.outputs.needs_sync == 'true' && needs.check-release.outputs.release_prerelease != 'true' && needs.test-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A PAT is needed to push upstream changes that touch workflow files.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Merge the tested release into main
        env:
          BASE_SHA: ${{ needs.check-release.outputs.base_sha }}
          RELEASE_SHA: ${{ needs.check-release.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.check-release.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/JamsusMaximus/trainingpeaks-mcp.git
          git fetch origin "refs/heads/main:refs/remotes/origin/main"
          git fetch --no-tags upstream "refs/tags/$RELEASE_TAG:refs/upstream-tags/$RELEASE_TAG"

          current_main=$(git rev-parse refs/remotes/origin/main)
          if [[ "$current_main" != "$BASE_SHA" ]]; then
            echo "::error::main changed after tests; retry on the next schedule."
            exit 1
          fi

          fetched_release=$(git rev-parse "refs/upstream-tags/$RELEASE_TAG^{commit}")
          if [[ "$fetched_release" != "$RELEASE_SHA" ]]; then
            echo "::error::The upstream release tag changed after tests."
            exit 1
          fi

          git checkout --detach "$BASE_SHA"
          git merge --no-ff --no-edit "$RELEASE_SHA"
          candidate_sha=$(git rev-parse HEAD)

          if git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/origin-tags/$RELEASE_TAG"
            existing_tag_sha=$(git rev-parse "refs/origin-tags/$RELEASE_TAG^{commit}")
            if [[ "$existing_tag_sha" != "$RELEASE_SHA" ]]; then
              echo "::error::Fork tag $RELEASE_TAG exists but points to a different commit."
              exit 1
            fi
            git push origin "$candidate_sha:refs/heads/main"
          else
            git push --atomic origin \
              "$candidate_sha:refs/heads/main" \
              "refs/upstream-tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          fi

          echo "Synced upstream release $RELEASE_TAG to main."

  report-failure:
    needs: [check-release, test-release]
    if: >-
      always() && needs.check-release.outputs.needs_sync == 'true' &&
      (needs.check-release.outputs.conflict == 'true' || needs.test-release.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      RELEASE_TAG: ${{ needs.check-release.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.check-release.outputs.release_sha }}
      BASE_SHA: ${{ needs.check-release.outputs.base_sha }}
      PRERELEASE: ${{ needs.check-release.outputs.release_prerelease }}
      CONFLICT: ${{ needs.check-release.outputs.conflict }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Open an issue and record the release as handled
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/JamsusMaximus/trainingpeaks-mcp.git
          git fetch --no-tags upstream "refs/tags/$RELEASE_TAG:refs/upstream-tags/$RELEASE_TAG"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          release_url="https://github.com/JamsusMaximus/trainingpeaks-mcp/releases/tag/$RELEASE_TAG"

          if [[ "$CONFLICT" == true ]]; then
            reason="Merging it into \`main\` produces **conflicts**."
          else
            reason="The test suite fails on \`main\` merged with it: $run_url"
          fi

          if [[ "$PRERELEASE" == true ]]; then
            title="Upstream prerelease $RELEASE_TAG breaks the fork"
            todo="Prereleases are tested but never merged. The next stable release will likely need the same fix."
          else
            branch="sync/upstream-$RELEASE_TAG"
            git checkout -b "$branch" "$BASE_SHA"
            if ! git merge --no-ff -m "Sync upstream $RELEASE_TAG" "$RELEASE_SHA"; then
              git add -A
              git commit -qm "Sync upstream $RELEASE_TAG (conflicts to resolve)"
            fi
            git push --force origin "$branch"
            title="Upstream release $RELEASE_TAG cannot be merged"
            todo="Fix it on the branch \`$branch\` (already pushed), then open a PR to \`main\`."
          fi

          body="Upstream [$RELEASE_TAG]($release_url) is not compatible with the fork. $reason $todo"
          existing=$(gh issue list --state all --search "\"$title\" in:title" --json title --jq "map(select(.title == \"$title\")) | length")
          if [[ "$existing" == 0 ]]; then
            # Assigning Copilot lets it propose a fix as a PR; the issue is still created if that fails.
            gh issue create --title "$title" --body "$body" --assignee copilot \
              || gh issue create --title "$title" --body "$body"
          fi

          git tag "upstream-handled/$RELEASE_TAG" "$BASE_SHA"
          git push origin "refs/tags/upstream-handled/$RELEASE_TAG"

  record-prerelease:
    needs: [check-release, test-release]
    if: needs.check-release.outputs.needs_sync == 'true' && needs.check-release.outputs.release_prerelease == 'true' && needs.test-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record the tested prerelease
        env:
          RELEASE_TAG: ${{ needs.check-release.outputs.release_tag }}
          BASE_SHA: ${{ needs.check-release.outputs.base_sha }}
        run: |
          git tag "upstream-handled/$RELEASE_TAG" "$BASE_SHA"
          git push origin "refs/tags/upstream-handled/$RELEASE_TAG"
          echo "Prerelease $RELEASE_TAG passes the tests; it will be merged once it becomes a stable release."
